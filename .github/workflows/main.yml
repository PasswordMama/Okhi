name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Finds a .zip in the repo (any name, any folder), extracts it and locates the pom.xml inside.
      # If there are several zips, the one committed most recently is used.
      # If there is no zip but the repo already has a pom.xml, it builds the repo as it is.
      - name: Extract project zip
        run: |
          set -euo pipefail
          ZIP=""
          BEST=0
          while IFS= read -r f; do
            T=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0)
            [ -z "$T" ] && T=0
            if [ -z "$ZIP" ] || [ "$T" -gt "$BEST" ]; then ZIP="$f"; BEST="$T"; fi
          done < <(find . -type f -iname '*.zip' -not -path './.git/*' -not -path './_extracted/*' | sort)

          if [ -n "$ZIP" ]; then
            echo "Using zip: $ZIP"
            rm -rf _extracted
            mkdir -p _extracted
            unzip -q -o "$ZIP" -d _extracted
            POM=$(find _extracted -name pom.xml -not -path '*__MACOSX*' | awk '{ print gsub("/","/") " " $0 }' | sort -n | head -n1 | cut -d' ' -f2-)
          else
            echo "No zip found, looking for a pom.xml in the repo"
            POM=$(find . -name pom.xml -not -path './.git/*' | awk '{ print gsub("/","/") " " $0 }' | sort -n | head -n1 | cut -d' ' -f2-)
          fi

          if [ -z "$POM" ]; then
            echo "::error::No pom.xml found (no zip with a Maven project, and none in the repo)."
            exit 1
          fi
          DIR=$(dirname "$POM")
          echo "Project directory: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Build
        run: mvn -B -f "$PROJECT_DIR/pom.xml" package

      - uses: actions/upload-artifact@v4
        with:
          name: CaneIslands
          path: |
            ${{ env.PROJECT_DIR }}/target/*.jar
            !${{ env.PROJECT_DIR }}/target/original-*.jar
