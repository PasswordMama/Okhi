name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract the zip
        run: |
          set -euo pipefail
          rm -rf _build && mkdir -p _build
          n=0
          PROJECT=""
          while IFS= read -r -d '' z; do
            n=$((n+1))
            out="_build/$n"
            mkdir -p "$out"
            echo "Extracting: $z"
            unzip -q -o "$z" -d "$out"
            pom=$(find "$out" -name pom.xml -not -path '*/__MACOSX/*' \
              | awk '{print gsub("/","/"), $0}' | sort -n | head -1 | cut -d' ' -f2-)
            if [ -n "$pom" ]; then
              PROJECT=$(dirname "$pom")
              echo "  -> project found in: $PROJECT"
            fi
          done < <(find . -type f -iname '*.zip' -not -path './.git/*' -not -path './_build/*' -print0 | sort -z)

          # no zip with a project inside? fall back to an already-extracted project in the repo root
          if [ -z "$PROJECT" ] && [ -f pom.xml ]; then PROJECT="."; fi
          if [ -z "$PROJECT" ]; then
            echo "::error::No zip containing a pom.xml was found in the repository."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Build
        run: mvn -B -f "$PROJECT_DIR/pom.xml" package

      - uses: actions/upload-artifact@v4
        with:
          name: CaneIslands
          path: ${{ env.PROJECT_DIR }}/target/*.jar
          if-no-files-found: error
